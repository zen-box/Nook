name: iOS build and tests
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and run core tests
        run: |
          mkdir -p build/logs
          set -o pipefail
          xcodebuild -version
          swift test --package-path packages/NookCore 2>&1 | tee build/logs/core-tests.log
      - name: Generate project
        run: bash scripts/generate-project.sh
      - name: Select an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; phones=[d for group in devices.values() for d in group if d["name"].startswith("iPhone")]; print(phones[0]["udid"])')
          echo "IOS_TEST_DESTINATION=platform=iOS Simulator,id=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: App unit and UI tests
        run: bash scripts/test-ios.sh
      - name: Release iPhone build
        run: bash scripts/build-ios-device-unsigned.sh
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d build/test-results/Nook.xcresult ]; then
            xcrun xcresulttool export attachments --path build/test-results/Nook.xcresult --output-path build/screenshots
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-diagnostics
          path: |
            build/logs/
            build/test-results/
            build/screenshots/
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nook-unsigned
          path: build/Nook-unsigned.ipa
