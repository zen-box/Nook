# XcodeGen spec for the Nook iOS app. Generate the project with:
#   bash scripts/generate-project.sh        (pins XcodeGen 2.46.0)
# The generated ios/Nook.xcodeproj is not committed.

name: Nook

options:
  bundleIdPrefix: com.nook
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  NookCore:
    path: ../packages/NookCore

targets:
  Nook:
    type: application
    platform: iOS
    sources:
      - path: Nook
    dependencies:
      - package: NookCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nook.personal
        PRODUCT_NAME: Nook
        INFOPLIST_FILE: Config/Nook-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - NookTests
        - NookUITests

  NookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NookTests
    dependencies:
      - target: Nook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nook.personal.tests
        GENERATE_INFOPLIST_FILE: YES

  NookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NookUITests
    dependencies:
      - target: Nook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nook.personal.uitests
        GENERATE_INFOPLIST_FILE: YES
